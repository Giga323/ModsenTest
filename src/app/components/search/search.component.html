<div class="search">
  <div class="search__string">
    <input
      class="search__string__input"
      type="text"
      (keyup)="search(getValue($event))"
      placeholder="Search Art, Artist, Work..." />

    <app-filter-menu class="filter" (optionEvent)="filterBy($event)"></app-filter-menu>
  </div>

  <div class="search__error" *ngIf="searchError">{{ searchError }}</div>

  <div class="search__result">
    <ng-container *ngFor="let item of inputResult | async">
      <div class="search__result__item">
        <app-search-item [itemInfo]="item"></app-search-item>
      </div>
    </ng-container>
  </div>
</div>
